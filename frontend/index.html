<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sudoku</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">

        <h1>Sudoku</h1>

        <div class="controls">

            <select id="difficulty">
                <option value="easy">
                    Easy
                </option>

                <option value="medium" selected>
                    Medium
                </option>

                <option value="hard">
                    Hard
                </option>
            </select>


            <button id="new-game-btn">
                New Game
            </button>


            <button id="hint-btn">
                Hint
            </button>


            <button id="solve-btn">
                Solve
            </button>

        </div>


        <div
            id="message"
            class="message"
        ></div>


        <div
            id="board"
            class="board"
        ></div>

    </main>


    <script src="script.js"></script>

</body>
</html>
